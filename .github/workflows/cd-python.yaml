name: "Python Continuous Deployment"

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DEPLOY_HOOK:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ inputs.image-name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USER }}/${{ inputs.image-name }}:latest

      - name: Deploy
        if: ${{ secrets.DEPLOY_HOOK != '' }}
        run: curl -X POST "${{ secrets.DEPLOY_HOOK }}"