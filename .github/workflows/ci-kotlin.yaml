name: "Kotlin Continuous Integration"

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - run: ./gradlew ktlintCheck detekt test